<style>
:root { --bg: #06070c; --fg: #eef0f7; --muted: #a3a9be; --line: rgba(255,255,255,.12); color-scheme: dark; }

* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: Inter, -apple-system, "Segoe UI", sans-serif; padding: 24px max(16px, env(safe-area-inset-left)); }
main { max-width: 520px; display: grid; gap: 18px; }
code { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 14px; color: var(--muted); }
h1 { margin: 0; font-size: clamp(40px, 9vw, 64px); line-height: 1; letter-spacing: -0.04em; }
h1 span { background: linear-gradient(100deg, #8ecbff, #a99bff 45%, #ff8fb1); -webkit-background-clip: text; background-clip: text; color: transparent; }
p { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.55; }
a { justify-self: start; color: var(--fg); text-decoration: none; font-weight: 700; padding: 12px 20px; border-radius: 999px; border: 1px solid var(--line); }
a:hover { border-color: var(--fg); }
</style>
